<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>arvea dz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap">
<style>
:root{--bg:#EEF4F1;--card:#FFFFFF;--ink:#16323A;--mute:#5B7178;--line:#D3E0DA;--accent:#0F6B5C;--accent-ink:#FFFFFF;--pick:#DDF0E8;--warn:#FFF1E0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1C20;--card:#16282D;--ink:#E6F1ED;--mute:#9FB5AD;--line:#2A4148;--accent:#5FD1B5;--accent-ink:#06211B;--pick:#1D3B38;--warn:#3A2D1C}}
:root[data-theme="dark"]{--bg:#0F1C20;--card:#16282D;--ink:#E6F1ED;--mute:#9FB5AD;--line:#2A4148;--accent:#5FD1B5;--accent-ink:#06211B;--pick:#1D3B38;--warn:#3A2D1C}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.8}
main{max-width:640px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:1.9rem;line-height:1.4;margin:0 0 8px;font-weight:600}
h2{font-size:1.3rem;margin:0 0 6px;font-weight:600}
p{margin:0}
.sub{color:var(--mute);margin-bottom:24px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.opts{display:grid;gap:10px;margin:18px 0}
.opt{font:inherit;color:inherit;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt[aria-pressed="true"]{background:var(--pick);border-color:var(--accent)}
.opt .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--pick)}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 26px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.res h3{margin:0 0 8px;font-size:1.1rem}
.res h4{margin:12px 0 4px;font-size:.95rem;color:var(--accent)}
.res ul{margin:0;padding-inline-start:20px}
.note{background:var(--warn);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:.92rem}
.fr{color:var(--mute);font-size:.88rem;direction:ltr;text-align:right;margin-bottom:8px}.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:16px 0;box-shadow:0 8px 24px rgba(15,40,35,.10)}.pic{background:#fff;display:flex;justify-content:center;padding:14px 14px 0}.pic img{display:block;width:100%;max-width:300px;height:300px;object-fit:contain;border-radius:12px}.info{padding:16px 18px 20px}.info h3{margin:0 0 2px;font-size:1.2rem}.for{margin:0 0 6px;color:var(--accent);font-size:.9rem;font-weight:600}.why{margin-bottom:14px}.buy{display:block;text-align:center;text-decoration:none;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:13px 20px;letter-spacing:.02em}.small{color:var(--mute);font-size:.85rem;margin-top:18px}
</style>
</head>

 acne:{g:"skin",t:"حبوب البشرة"},oily:{g:"skin",t:"البشرة الدهنية"},dryskin:{g:"skin",t:"جفاف البشرة"},spots:{g:"skin",t:"البقع والتصبغات"},dull:{g:"skin",t:"بشرة باهتة وخلايا ميتة"},aging:{g:"skin",t:"التعب وعلامات التقدّم"}
};
function has(k){return(ans.p||[]).indexOf(k)>-1}
function hair(){return(ans.p||[]).some(function(k){return PROBLEMS[k].g==="hair"})}
function skin(){return(ans.p||[]).some(function(k){return PROBLEMS[k].g==="skin"})}
var QS=[
 {id:"p",multi:true,q:"ما الذي يزعجك؟",s:"اختر مشكلة أو أكثر",o:Object.keys(PROBLEMS).map(function(k){return[k,PROBLEMS[k].t]})},
 {id:"age",q:"كم عمرك؟",o:[["u25","أقل من 25"],["a25","من 25 إلى 35"],["a35","من 35 إلى 45"],["o45","أكثر من 45"]]},
 {id:"htype",f:hair,q:"كيف هو شعرك؟",o:[["straight","أملس"],["wavy","مموّج"],["curly","مجعّد"]]},
 {id:"dyed",f:hair,q:"هل شعرك مصبوغ أو مفرود (ليسّاج)؟",o:[["y","نعم"],["n","لا"]]},
 {id:"heat",f:hair,q:"كم مرة تستعمل المجفف أو المكواة؟",o:[["daily","كل يوم تقريباً"],["some","أحياناً"],["rare","نادراً أو أبداً"]]},
 {id:"wash",f:hair,q:"كم مرة تغسل شعرك في الأسبوع؟",o:[["1","مرة أو مرتين"],["3","3 إلى 4 مرات"],["7","كل يوم"]]},
 {id:"sea",f:hair,q:"هل يتعرض شعرك كثيراً للشمس أو البحر أو المسبح؟",o:[["y","نعم"],["n","لا"]]},
 {id:"stype",f:skin,q:"ما نوع بشرتك؟",o:[["dry","جافة"],["oil","دهنية"],["mix","مختلطة"],["nor","عادية"]]},
 {id:"sens",f:skin,q:"هل بشرتك حساسة؟",o:[["y","نعم، تتهيّج بسرعة"],["n","لا، أتحمّل المنتجات"]]},
 {id:"zone",f:function(){return has("acne")},q:"أين تظهر الحبوب أكثر؟",o:[["t","الجبهة والأنف"],["c","الخدّان والذقن"],["a","في كل الوجه"]]},
 {id:"spf",f:skin,q:"هل تضع واقي الشمس يومياً؟",o:[["y","نعم"],["s","أحياناً"],["n","لا"]]},
 {id:"clean",f:skin,q:"هل تنظّف وجهك قبل النوم؟",o:[["y","دائماً"],["s","أحياناً"],["n","نادراً"]]},
 {id:"mk",f:skin,q:"هل تضعين المكياج بانتظام؟",o:[["y","نعم"],["n","لا"]]},
 {id:"sleep",q:"كم ساعة تنام في الليلة؟",o:[["lo","أقل من 6"],["ok","من 6 إلى 8"],["hi","أكثر من 8"]]},
 {id:"water",q:"كم تشرب من الماء يومياً؟",o:[["lo","أقل من لتر"],["mid","من لتر إلى لترين"],["hi","أكثر من لترين"]]}
];
function pick(k){
 var a=ans;
 if(k==="dryhair"){
  if(a.dyed==="y")return["masqsans","شعرك مصبوغ أو مفرود، وهذا القناع خالٍ من السلفات فيحافظ على نتيجة العناية."];
  if(a.heat==="daily")return["protect","تستعمل الحرارة كثيراً، وهذا الكريم يحمي الشعر منها."];
  if(a.htype==="curly")return["oil","الشعر المجعّد يحتاج ترطيباً غنياً يمنحه ليونة ولمعاناً."];
  return["masque","يغذّي الشعر ويرطّبه ويسهّل تسريحه."]}
 if(k==="hairfall")return["antichute","يقوّي الشعر ويحفّز فروة الرأس."];
 if(k==="dandruff")return["antipell","يزيل القشرة المرئية ويهدّئ الحكة."];
 if(k==="oilyhair")return["gras","ينظّف فروة الرأس من الدهون ويحافظ على توازنها."];
 if(k==="acne")return["gel","جل منظّف مناسب للبشرة المختلطة أو الدهنية."];
 if(k==="oily")return["gel","ينظّف البشرة المختلطة أو الدهنية بلطف."];
 if(k==="dryskin"){
  if(a.sens==="y")return["mousse","رغوة لطيفة للبشرة الجافة والحساسة."];
  return["creme","كريم مرطّب لبشرة جافة تحتاج ترطيباً يومياً."]}
 if(k==="spots"){
  if(a.spf==="y")return["serum","تضعين واقي الشمس بالفعل، فالسيروم يكمل الترطيب والعناية."];
  return["solaire","لا تعود البقع إلى الظهور من دون حماية يومية من الشمس."]}
 if(k==="dull")return["exfo","يزيل الخلايا الميتة ويعيد النضارة للبشرة."];
 return["nuit","كريم ليلي غني يدعم تجديد الخلايا."]}
var TIPS={
 sleep_lo:"نومك أقل من 6 ساعات، وهذا ينعكس على البشرة والشعر. حاول الوصول إلى 7 ساعات.",
 water_lo:"اشرب لتراً ونصف على الأقل يومياً.",
 clean_n:"نظّف وجهك كل مساء، فهذا أهم ما تفعله لبشرتك.",
 spf_n:"ضع واقي الشمس كل صباح حتى في الشتاء.",
 wash_7:"الغسل اليومي بشامبو قوي يجفّف الشعر، فاختر شامبو لطيفاً.",
 heat_daily:"خفّف استعمال الحرارة، أو ضع واقياً قبلها.",
 zone_c:"الحبوب على الخدّين والذقن ترتبط غالباً بالهرمونات أو بملامسة اليدين، فلا تلمس وجهك كثيراً.",
 zone_t:"الحبوب على الجبهة والأنف ترتبط غالباً بالدهون وبملامسة الشعر للجبهة.",
 sens_y:"بشرتك حساسة: أدخل منتجاً جديداً واحداً كل أسبوعين، وجرّبه أولاً خلف الأذن."
};
/* ================================================================== */
var app=document.getElementById("app"),ans={},step=0,sel=[];
function list(){return QS.filter(function(q){return!q.f||q.f()})}
function el(h){app.innerHTML=h;window.scrollTo(0,0)}
function start(){ans={};step=0;sel=[];el('<h1>ماذا تحتاج بشرتك وشعرك؟</h1><p class="sub">أجب عن بضعة أسئلة قصيرة، وسنقترح عليك منتجات أرفيا التي تناسب حالتك.</p><button class="btn" id="go">ابدأ</button>');document.getElementById("go").onclick=ask}
function ask(){
  var qs=list(),q=qs[step];
  if(!q)return result();
  sel=[];
  var h='<div class="bar"><i style="width:'+Math.round(step/qs.length*100)+'%"></i></div><h2>'+q.q+'</h2>'+(q.s?'<p class="sub">'+q.s+'</p>':'')+'<div class="opts">';
  q.o.forEach(function(o){h+='<button class="opt" aria-pressed="false" data-v="'+o[0]+'"><span>'+o[1]+'</span><span class="tick"></span></button>'});
  h+='</div><div class="row"><button class="btn" id="next" disabled>التالي</button>'+(step>0?'<button class="btn ghost" id="back">رجوع</button>':'')+'</div>';
  el(h);
  var nx=document.getElementById("next");
  app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    var v=b.dataset.v;
    if(q.multi){var i=sel.indexOf(v);if(i<0)sel.push(v);else sel.splice(i,1);b.setAttribute("aria-pressed",i<0)}
    else{sel=[v];app.querySelectorAll(".opt").forEach(function(x){x.setAttribute("aria-pressed",x===b)})}
    nx.disabled=!sel.length}});
  nx.onclick=function(){ans[q.id]=q.multi?sel.slice():sel[0];step++;ask()};
  var bk=document.getElementById("back");if(bk)bk.onclick=function(){step--;ask()};
}
function card(key,forWhat,why){
  var p=P[key];
  return'<section class="prod"><div class="pic"><img src="'+IMG[key]+'" alt="'+p.ar+'"></div><div class="info"><p class="for">'+forWhat+'</p><h3>'+p.ar+'</h3><p class="fr">'+p.fr+(p.sz?' · '+p.sz:'')+'</p><p class="why">'+why+'</p><a class="buy" href="'+BUY+'" target="_blank" rel="noopener">Acheter</a></div></section>'}
function result(){
  var by={},order=[];
  function add(key,t,why){if(!by[key]){by[key]={t:[],why:why};order.push(key)}by[key].t.push(t)}
  ans.p.forEach(function(k){var r=pick(k);add(r[0],PROBLEMS[k].t,r[1])});
  if(has("dryhair")&&ans.sea==="y")add("sunhair","شعر يتعرّض للشمس والبحر","يحمي الشعر من الأشعة فوق البنفسجية والملح والكلور.");
  if(skin()&&ans.mk==="y")add("micel","إزالة المكياج","ينظّف البشرة من المكياج بلطف قبل بقية الروتين.");
  var h='<div class="bar"><i style="width:100%"></i></div><h1>هذا ما يناسبك</h1><p class="sub">منتجات من أرفيا مختارة حسب إجاباتك.</p>';
  order.forEach(function(k){h+=card(k,by[k].t.join("، "),by[k].why)});
  var tips=[];
  if(ans.sleep==="lo")tips.push(TIPS.sleep_lo);
  if(ans.water==="lo")tips.push(TIPS.water_lo);
  if(skin()&&ans.clean==="n")tips.push(TIPS.clean_n);
  if(skin()&&ans.spf==="n")tips.push(TIPS.spf_n);
  if(hair()&&ans.wash==="7")tips.push(TIPS.wash_7);
  if(hair()&&ans.heat==="daily")tips.push(TIPS.heat_daily);
  if(ans.zone==="c")tips.push(TIPS.zone_c);
  if(ans.zone==="t")tips.push(TIPS.zone_t);
  if(ans.sens==="y")tips.push(TIPS.sens_y);
  if(tips.length)h+='<section class="res"><h3>نصائح من إجاباتك</h3><ul>'+tips.map(function(t){return'<li>'+t+'</li>'}).join("")+'</ul></section>';
  h+='<p class="small">هذه إرشادات عامة وليست تشخيصاً طبياً، وإن كانت المشكلة شديدة أو مستمرة فاستشر طبيباً.</p><div class="row" style="margin-top:18px"><button class="btn" id="again">أعد الاختبار</button></div>';
  el(h);document.getElementById("again").onclick=start;
}
start();
</script>
</body>
</html>
